stages:
  - release

release:
  stage: release
  image:
    name: registry.hpc.ut.ee/mirror/goreleaser/goreleaser:latest
    entrypoint: [""]
  variables:
    # Retrieve complete history for goreleaser changelog generation
    GIT_DEPTH: 0
  before_script:
    # The goreleaser image ships gpg and gpgconf but not the gpg-agent binary,
    # so `gpg-connect-agent /bye` below fails with "probably not installed" and
    # the release never gets as far as signing. Install the full gnupg suite
    # first. This is what stopped the v8.1.0 provider from being published.
    - |
      if ! command -v gpg-agent >/dev/null 2>&1; then
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache gnupg
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update && apt-get install -y --no-install-recommends gnupg
        else
          echo "ERROR: no supported package manager to install gnupg" >&2
          exit 1
        fi
      fi
      gpg-agent --version | head -n 1

    # Setup non-interactive GPG signing
    - mkdir -p ~/.gnupg
    - chmod 700 ~/.gnupg
    - echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
    - echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
    - gpgconf --kill gpg-agent
    - gpg-connect-agent /bye

    # Import the private GPG key
    - echo "$GPG_PRIVATE_KEY" | gpg --batch --import

    # Extract the key's fingerprint
    - |
      export GPG_FINGERPRINT=$(gpg --with-colons --list-keys | awk -F: '$1 == "fpr" {print $10; exit}')

    # Perform a dummy signature to cache the passphrase in the GPG agent
    - echo "test" | gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$GPG_FINGERPRINT" --detach-sign -
  script:
    - goreleaser release --clean
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
