# Visit https://goreleaser.com for documentation on how to customize this
# behavior.
version: 2

# The Terraform Registry only ingests GitHub releases, but this pipeline runs on
# GitLab, so goreleaser would otherwise infer the forge from the origin remote
# and publish a GitLab release that the Registry never sees. Pin the forge
# explicitly: GITLAB_TOKEN is set group-wide for the deploy job, and goreleaser
# errors out when it can see two forge tokens at once.
force_token: github

before:
  hooks:
    # this is just an example and not a requirement for provider building/publishing
    - go mod tidy
builds:
- env:
    # goreleaser does not work with CGO, it could also complicate
    # usage by users in CI/CD systems like HCP Terraform where
    # they are unable to install libraries.
    - CGO_ENABLED=0
  mod_timestamp: '{{ .CommitTimestamp }}'
  flags:
    - -trimpath
  ldflags:
    - '-s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }}'
  goos:
    - freebsd
    - windows
    - linux
    - darwin
  goarch:
    - amd64
    - '386'
    - arm
    - arm64
  ignore:
    - goos: darwin
      goarch: '386'
    - goos: windows
      goarch: arm
  binary: 'terraform-provider-waldur_v{{ .Version }}'
archives:
- formats:
  - zip
  name_template: 'terraform-provider-waldur_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
checksum:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: 'terraform-provider-waldur_{{ .Version }}_manifest.json'
  name_template: 'terraform-provider-waldur_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
signs:
  - artifacts: checksum
    args:
      # if you are using this in a GitHub action or some other automated pipeline, you 
      # need to pass the batch flag to indicate its not interactive.
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}" # set this environment variable for your signing key
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
release:
  # Overrides the owner/name goreleaser would extract from the origin remote,
  # which under GitLab CI points at the GitLab project rather than the mirror
  # the Registry watches.
  github:
    owner: waldur
    name: terraform-provider-waldur
  # Must stay false, including for rc/beta tags. The Terraform Registry does not
  # ingest GitHub releases flagged as prereleases: v8.1.3-rc.2 sat unpublished
  # until the flag was cleared by hand, then appeared within minutes. Every
  # prerelease listed on the Registry that we could find is unflagged --
  # hashicorp/aws 6.0.0-beta1..3, hashicorp/nomad 2.0.0-beta.1 and 2.0.0-rc.2,
  # integrations/github 6.0.0-alpha and 6.0.0-beta, 7 of 7.
  #
  # The semver suffix in the tag is what makes a version a prerelease to
  # Terraform, and it still behaves as one: a range like ">= 8.1" skips it, and
  # only an exact pin installs it. Marking the GitHub release as well adds
  # nothing and costs publication, so do not "fix" this back to auto.
  prerelease: false
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: 'terraform-provider-waldur_{{ .Version }}_manifest.json'
  # If you want to manually examine the release before its live, uncomment this line:
  # draft: true
changelog:
  disable: true
